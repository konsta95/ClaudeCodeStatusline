# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  auto_review:
    # The default of 5 behaves exactly as documented. Re-measured 2026-08-29 by comment
    # revision: the pause block is written INTO the walkthrough comment by a later edit,
    # so that comment's creation time does not date it. Reading the full body at each
    # revision puts the pause at PR #2 revision 11 and PR #3 revision 16 -- five pushed
    # commits in both cases.
    #
    # It is raised here because both fix loops in this repo ran past 5 commits and both
    # were interrupted mid-loop. 25 clears the largest PR so far (9 commits); it is
    # headroom, not a derived bound. 0 would disable the pause entirely, at a documented
    # cost to the review allowance, so the safety valve is kept.
    auto_pause_after_reviewed_commits: 25
